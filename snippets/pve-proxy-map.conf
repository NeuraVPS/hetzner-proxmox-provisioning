# Node name from wildcard host (e.g. 000001-EX44.pve.neuravps.com -> 000001-EX44)
# Include from http {} (e.g. /etc/nginx/conf.d/)
map $host $pve_node_from_host {
    "~^([0-9]+-[^.]+)\\.pve\\.neuravps\\.com$" $1;
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
