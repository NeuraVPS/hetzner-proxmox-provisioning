# NeuraVPS web file browser — nginx front for the SMB bridge.
# Served on BOTH bases (files-hel routes to b1, files-fsn to b0 via DNS; each
# base serves both names so a failover keeps working). Proxies to the local
# bridge on 127.0.0.1:8088. Uses the dedicated `file-bridge` cert (NOT
# neuravps-dual) so this never touches the customer-facing PVE-console cert.
# Deploy: /etc/nginx/sites-available/file-bridge.conf + symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.

server {
    server_name files-hel.neuravps.com files-fsn.neuravps.com;

    # Uploads stream straight to the bridge (which caps at 20 GB itself); do
    # not let nginx buffer or size-limit them.
    client_max_body_size 0;
    proxy_request_buffering off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long transfers (big up/downloads share the base NIC; the bridge
        # throttles per-session).
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/file-bridge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/file-bridge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name files-hel.neuravps.com files-fsn.neuravps.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
