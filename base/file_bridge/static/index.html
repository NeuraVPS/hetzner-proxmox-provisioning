<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegador de archivos · NeuraVPS</title>
<script>
// Theme before first paint (no flash): ?theme=dark|light from the panel wins,
// else the OS preference. The main script reads dataset.theme back.
(function(){var q=new URLSearchParams(location.search),t=(q.get("theme")||"").toLowerCase();
if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t;})();
</script>
<style>
  :root { color-scheme:light;
          --bg:#f3f4f6; --panel:#fff; --line:#e5e7eb; --ink:#1f2937; --muted:#6b7280;
          --accent:#2563eb; --accent-bg:#eff6ff; --danger:#dc2626; --danger-bg:#fef2f2;
          --th-bg:#fafafa; --row-hover:#f9fafb; --card:#fff; --input-bg:#fff;
          --toast-bg:#111827; --toast-ink:#fff; --overlay:rgba(0,0,0,.35);
          --shadow:0 10px 40px rgba(0,0,0,.2); }
  :root[data-theme="dark"] { color-scheme:dark;
          --bg:#0b0b0e; --panel:#18181b; --line:#27272a; --ink:#ececee; --muted:#a1a1aa;
          --accent:#60a5fa; --accent-bg:rgba(59,130,246,.16); --danger:#f87171; --danger-bg:rgba(248,113,113,.14);
          --th-bg:#1c1c20; --row-hover:#212127; --card:#1f1f24; --input-bg:#101013;
          --toast-bg:#f4f4f5; --toast-ink:#111827; --overlay:rgba(0,0,0,.6);
          --shadow:0 10px 40px rgba(0,0,0,.6); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; flex-direction:column; height:100%; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header .brand { font-weight:700; color:var(--accent); }
  select, button, input[type=text] { font:inherit; }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); }
  .toolbar { background:var(--panel); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .btn:hover:not(:disabled) { background:var(--accent-bg); border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.danger:hover:not(:disabled) { background:var(--danger-bg); border-color:var(--danger); color:var(--danger); }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  .crumbs { padding:8px 14px; color:var(--muted); display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .crumbs a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .crumbs a:hover { text-decoration:underline; }
  main { flex:1; overflow:auto; padding:0 8px 8px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th.ck,td.ck { width:34px; padding:8px 2px 8px 12px; }
  .ck input { width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }
  th { position:sticky; top:0; background:var(--th-bg); color:var(--muted); font-weight:600; z-index:1; }
  #thName,#thSize,#thDate { cursor:pointer; user-select:none; }
  #thName:hover,#thSize:hover,#thDate:hover { color:var(--accent); }
  tr.row { cursor:default; user-select:none; }
  tr.row:hover { background:var(--row-hover); }
  tr.row.sel { background:var(--accent-bg); }
  td.name { width:100%; white-space:normal; }
  td.name .ic { margin-right:8px; }
  td.size,td.date { color:var(--muted); text-align:right; }
  .cut { opacity:.5; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:6px 14px; color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  #clip { color:var(--accent); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--toast-bg); color:var(--toast-ink); padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
  #toast.show { opacity:.95; }
  #overlay { position:fixed; inset:0; background:var(--overlay); display:none; align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .card { background:var(--card); border-radius:12px; padding:18px; min-width:280px; max-width:90%; box-shadow:var(--shadow); }
  .card h3 { margin:0 0 12px; }
  .card input { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); }
  .card .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand" id="brand"></span>
    <label><span id="serverLbl"></span>
      <select id="server"></select>
    </label>
    <span id="status" style="color:var(--muted)"></span>
  </header>
  <div class="toolbar">
    <button class="btn" id="up">⬆️</button>
    <button class="btn" id="refresh">🔄</button>
    <span class="sep"></span>
    <button class="btn" id="upload">⬆️</button>
    <button class="btn" id="mkdir">📁</button>
    <button class="btn" id="download">⬇️</button>
    <span class="sep"></span>
    <button class="btn" id="copy">📋</button>
    <button class="btn" id="cut">✂️</button>
    <button class="btn" id="paste">📥</button>
    <span class="sep"></span>
    <button class="btn" id="rename">✏️</button>
    <button class="btn danger" id="del">🗑️</button>
    <input type="file" id="fileinput" multiple hidden>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <main>
    <table>
      <thead><tr><th class="ck"><input type="checkbox" id="selAll"></th><th id="thName"></th><th class="size" id="thSize"></th><th class="date" id="thDate"></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </main>
  <footer>
    <span id="sel"></span>
    <span id="clip"></span>
  </footer>
</div>
<div id="toast"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
const qs = new URLSearchParams(location.search);
// The link token arrives as #t= (fragment: never sent to the server, so it
// can't land in access logs) — legacy ?t= still accepted. It is redeemed
// ONCE at /api/session for an HttpOnly cookie, then stripped from the URL.
const TOKEN = new URLSearchParams(location.hash.replace(/^#/,"")).get("t") || qs.get("t") || "";
const $ = s => document.querySelector(s);

// ---- i18n: ?lang=es|en from the panel wins, else navigator.language
// (es→es, anything else→en — same rule as the panel's first visit).
const MSG = {
  es: {
    title:"Navegador de archivos · NeuraVPS", brand:"NeuraVPS · Archivos", server:"Servidor:",
    up:"⬆️ Arriba", upTitle:"Subir un nivel", refreshTitle:"Actualizar", upload:"⬆️ Subir",
    mkdir:"📁 Nueva carpeta", download:"⬇️ Descargar", copy:"📋 Copiar", cut:"✂️ Cortar",
    paste:"📥 Pegar", rename:"✏️ Renombrar", del:"🗑️ Eliminar",
    thName:"Nombre", thSize:"Tamaño", thDate:"Modificado",
    loading:"Cargando…", noServers:"No hay servidores encendidos.",
    items:n=>`${n} elemento(s)`, emptyFolder:"Carpeta vacía",
    selected:n=>`${n} seleccionado${n===1?"":"s"}`,
    selectAll:"Seleccionar todo",
    clipBar:(n,op)=>`Portapapeles: ${n} elemento(s) para ${op==="move"?"mover":"copiar"}`,
    clipSet:(n,op)=>`${n} elemento(s) ${op==="move"?"cortado(s)":"copiado(s)"}`,
    moving:"Moviendo…", copying:"Copiando…",
    pasted:(n,sz)=>`Pegado: ${n} elemento(s)`+(sz?` (${sz})`:""),
    errList:m=>"Error al listar: "+m, errPaste:m=>"Error al pegar: "+m, errDelete:m=>"Error al eliminar: "+m,
    zip:"Preparando ZIP…",
    mkdirTitle:"Nueva carpeta", mkdirLabel:"Nombre:", renameTitle:"Renombrar", renameLabel:"Nuevo nombre:",
    confirmTitle:"Confirmar", confirmDelete:n=>`¿Eliminar ${n} elemento(s)? Esta acción no se puede deshacer.`,
    deleting:"Eliminando…", cancel:"Cancelar", ok:"Aceptar", delBtn:"Eliminar",
    uploading:n=>`Subiendo ${n}…`, uploaded:n=>`Subido: ${n}`, errUpload:(n,m)=>`Error subiendo ${n}: ${m}`,
    noToken:"Falta el token de acceso. Abre el navegador desde el panel.",
    badSession:"Sesión no válida o caducada. Vuelve a abrir desde el panel.",
    expiredTitle:"Sesión caducada",
    expiredMsg:"La sesión ha caducado por seguridad. Cierra esta pestaña y vuelve a abrir el navegador de archivos desde el panel.",
    dateLocale:"es-ES",
  },
  en: {
    title:"File browser · NeuraVPS", brand:"NeuraVPS · Files", server:"Server:",
    up:"⬆️ Up", upTitle:"Up one level", refreshTitle:"Refresh", upload:"⬆️ Upload",
    mkdir:"📁 New folder", download:"⬇️ Download", copy:"📋 Copy", cut:"✂️ Cut",
    paste:"📥 Paste", rename:"✏️ Rename", del:"🗑️ Delete",
    thName:"Name", thSize:"Size", thDate:"Modified",
    loading:"Loading…", noServers:"No servers are powered on.",
    items:n=>`${n} item(s)`, emptyFolder:"Empty folder",
    selected:n=>`${n} selected`,
    selectAll:"Select all",
    clipBar:(n,op)=>`Clipboard: ${n} item(s) to ${op==="move"?"move":"copy"}`,
    clipSet:(n,op)=>`${n} item(s) ${op==="move"?"cut":"copied"}`,
    moving:"Moving…", copying:"Copying…",
    pasted:(n,sz)=>`Pasted: ${n} item(s)`+(sz?` (${sz})`:""),
    errList:m=>"Couldn't list: "+m, errPaste:m=>"Couldn't paste: "+m, errDelete:m=>"Couldn't delete: "+m,
    zip:"Preparing ZIP…",
    mkdirTitle:"New folder", mkdirLabel:"Name:", renameTitle:"Rename", renameLabel:"New name:",
    confirmTitle:"Confirm", confirmDelete:n=>`Delete ${n} item(s)? This action cannot be undone.`,
    deleting:"Deleting…", cancel:"Cancel", ok:"OK", delBtn:"Delete",
    uploading:n=>`Uploading ${n}…`, uploaded:n=>`Uploaded: ${n}`, errUpload:(n,m)=>`Error uploading ${n}: ${m}`,
    noToken:"Missing access token. Open the file browser from the panel.",
    badSession:"Session invalid or expired. Reopen it from the panel.",
    expiredTitle:"Session expired",
    expiredMsg:"Your session expired for security reasons. Close this tab and reopen the file browser from the panel.",
    dateLocale:"en-GB",
  },
};
const langParam = (qs.get("lang")||"").toLowerCase();
const LANG = (langParam==="es"||langParam==="en") ? langParam
  : ((navigator.language||"es").toLowerCase().startsWith("es") ? "es" : "en");
const T = MSG[LANG];

let STATE = { vmid:null, path:"", goodPath:"", entries:[], view:[], sel:new Set(), clip:null,
              sort:{key:"name",dir:1} }; // clip={op,items:[{vmid,path,name}]}; goodPath = last successfully LISTED path; view = rendered name order

function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = T.title;
  $("#brand").textContent = T.brand;
  $("#serverLbl").textContent = T.server;
  const set=(id,txt,title)=>{ const el=$(id); el.textContent=txt; if(title) el.title=title; };
  set("#up",T.up,T.upTitle); set("#refresh","🔄",T.refreshTitle); set("#upload",T.upload);
  set("#mkdir",T.mkdir); set("#download",T.download); set("#copy",T.copy); set("#cut",T.cut);
  set("#paste",T.paste); set("#rename",T.rename); set("#del",T.del);
  renderHeaders();
  $("#selAll").title=T.selectAll;
  $("#sel").textContent=T.selected(0);
}
applyStatic();

const fmtSize = n => { if(!n) return ""; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<4){n/=1024;i++;} return n.toFixed(i?1:0)+" "+u[i]; };
const fmtDate = t => t? new Date(t*1000).toLocaleString(T.dateLocale,{dateStyle:"short",timeStyle:"short"}) : "";

function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),ms); }
function status(msg){ $("#status").innerHTML = msg||""; }

let SESSION = false; // becomes true once /api/session succeeds
async function api(path, opts={}){
  const r = await fetch("/api/"+path, { headers:{...(opts.headers||{})}, ...opts });
  if(!r.ok){
    if(r.status===401 && SESSION){ fatalExpired(); }
    let m=r.status; try{ m=(await r.json()).detail||m; }catch{} throw new Error(m);
  }
  return r;
}
async function apiJSON(path, opts={}){ return (await api(path, opts)).json(); }

// ---- Session (cookie-based; the link token is single-use) ----
async function startSession(){
  const opts = {method:"POST"};
  if(TOKEN) opts.headers = {"Authorization":"Bearer "+TOKEN};
  const r = await fetch("/api/session", opts);
  if(!r.ok) throw new Error(r.status);
  SESSION = true;
  // Drop the token from the address bar/history; keep lang/theme for F5.
  const keep = new URLSearchParams();
  for(const k of ["lang","theme"]){ const v=qs.get(k); if(v) keep.set(k,v); }
  const q = keep.toString();
  history.replaceState(null,"",location.pathname+(q?"?"+q:""));
}
async function renew(){
  try{ const r = await fetch("/api/session",{method:"POST"}); if(r.status===401) fatalExpired(); }
  catch(e){}
}
setInterval(()=>{ if(SESSION && document.visibilityState==="visible") renew(); }, 20*60*1000);
document.addEventListener("visibilitychange",()=>{ if(SESSION && document.visibilityState==="visible") renew(); });
function fatalExpired(){
  $("#card").innerHTML=`<h3>${escapeHtml(T.expiredTitle)}</h3><p>${escapeHtml(T.expiredMsg)}</p>`;
  $("#overlay").classList.add("show"); $("#overlay").dataset.fatal="1";
}

// ---- Servers ----
async function loadServers(){
  const d = await apiJSON("servers");
  const sel = $("#server"); sel.innerHTML="";
  d.servers.forEach(s=>{ const o=document.createElement("option"); o.value=s.vmid; o.textContent=`${s.name} (VM ${s.vmid})`; sel.appendChild(o); });
  if(!d.servers.length){ status(T.noServers); return; }
  // Pre-select the server the browser was opened from (?vmid=), if present
  // and in the list; otherwise default to the first.
  const wantVmid = parseInt(qs.get("vmid")||"", 10);
  STATE.vmid = d.servers.some(s=>s.vmid===wantVmid) ? wantVmid : d.servers[0].vmid;
  sel.value = STATE.vmid;
}
$("#server").onchange = e => { STATE.vmid = +e.target.value; STATE.path=""; STATE.goodPath=""; STATE.sel.clear(); list(); };

// ---- Listing ----
function joinPath(p, name){ return p ? p+"\\"+name : name; }
async function list(){
  const reqPath = STATE.path, reqVmid = STATE.vmid;
  status('<span class="spin"></span> '+T.loading);
  try {
    const d = await apiJSON(`list?vmid=${reqVmid}&path=${encodeURIComponent(reqPath)}`);
    if(STATE.path!==reqPath || STATE.vmid!==reqVmid) return; // superseded by a newer navigation
    STATE.goodPath = reqPath;
    STATE.entries = d.entries; STATE.sel.clear(); lastAnchor=null;
    render();
    status(T.items(d.total));
  } catch(e){
    // Don't strand STATE.path on a folder that failed to open: revert to the
    // listing actually on screen, or the next double-click would chain paths
    // ("My Servers\MetaTrader\Program Files" bug, 2026-07-08).
    if(STATE.path===reqPath && STATE.vmid===reqVmid){ STATE.path = STATE.goodPath; renderCrumbs(); updateBar(); }
    status(""); toast(T.errList(e.message));
  }
}
let lastAnchor=null; // last plainly-clicked name, the Shift-range anchor
// ---- Column sorting (folders always grouped first, Explorer-style) ----
function renderHeaders(){
  const s=STATE.sort, arrow=d=>d===1?" ▲":" ▼";
  $("#thName").textContent=T.thName+(s.key==="name"?arrow(s.dir):"");
  $("#thSize").textContent=T.thSize+(s.key==="size"?arrow(s.dir):"");
  $("#thDate").textContent=T.thDate+(s.key==="mtime"?arrow(s.dir):"");
}
function setSort(key){
  const s=STATE.sort;
  if(s.key===key) s.dir=-s.dir; else { s.key=key; s.dir=1; }
  renderHeaders(); render();
}
$("#thName").onclick=()=>setSort("name");
$("#thSize").onclick=()=>setSort("size");
$("#thDate").onclick=()=>setSort("mtime");
function entryCmp(a,b){
  if(b.isDir!==a.isDir) return b.isDir-a.isDir; // folders first, always
  const s=STATE.sort;
  const byName=a.name.localeCompare(b.name,LANG,{numeric:true,sensitivity:"base"});
  let v = s.key==="size" ? (a.size||0)-(b.size||0)
        : s.key==="mtime" ? (a.mtime||0)-(b.mtime||0)
        : byName;
  return v!==0 ? v*s.dir : byName; // stable name tie-break, never flipped
}
function render(){
  const tb=$("#list"); tb.innerHTML="";
  const empty=$("#empty");
  const es=[...STATE.entries].sort(entryCmp);
  STATE.view = es.map(e=>e.name); // rendered order, for Shift ranges / select-all
  if(!es.length){ empty.hidden=false; empty.textContent=T.emptyFolder; } else empty.hidden=true;
  const cutSet = new Set((STATE.clip&&STATE.clip.op==="move"? STATE.clip.items:[]).filter(i=>i.vmid===STATE.vmid).map(i=>i.path));
  es.forEach(en=>{
    const tr=document.createElement("tr"); tr.className="row"+(cutSet.has(joinPath(STATE.path,en.name))?" cut":"");
    tr.dataset.name=en.name; tr.dataset.dir=en.isDir?"1":"";
    tr.innerHTML=`<td class="ck"><input type="checkbox" tabindex="-1"${STATE.sel.has(en.name)?" checked":""}></td>`+
                 `<td class="name"><span class="ic">${en.isDir?"📁":"📄"}</span>${escapeHtml(en.name)}</td>`+
                 `<td class="size">${en.isDir?"":fmtSize(en.size)}</td><td class="date">${fmtDate(en.mtime)}</td>`;
    tr.querySelector("input").onclick=ev=>{ ev.stopPropagation(); toggleSel(en.name); };
    tr.onclick=(ev)=>selectRow(en.name, ev);
    tr.ondblclick=()=>{ if(en.isDir){ STATE.path=joinPath(STATE.path,en.name); list(); } else download1(en.name); };
    if(STATE.sel.has(en.name)) tr.classList.add("sel");
    tb.appendChild(tr);
  });
  renderCrumbs(); updateBar();
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toggleSel(name){ // checkbox path: additive, no modifier needed (mobile!)
  STATE.sel.has(name)?STATE.sel.delete(name):STATE.sel.add(name);
  lastAnchor=name; syncSelUI();
}
function selectRow(name, ev){
  const v=STATE.view||[];
  if(ev.shiftKey && lastAnchor!==null && v.includes(lastAnchor)){
    const a=v.indexOf(lastAnchor), b=v.indexOf(name), [i,j]=a<b?[a,b]:[b,a];
    if(!(ev.ctrlKey||ev.metaKey)) STATE.sel.clear();
    for(let k=i;k<=j;k++) STATE.sel.add(v[k]);
  } else if(ev.ctrlKey||ev.metaKey){
    STATE.sel.has(name)?STATE.sel.delete(name):STATE.sel.add(name); lastAnchor=name;
  } else { STATE.sel.clear(); STATE.sel.add(name); lastAnchor=name; }
  syncSelUI();
}
function syncSelUI(){
  [...$("#list").children].forEach(tr=>{
    const on=STATE.sel.has(tr.dataset.name);
    tr.classList.toggle("sel", on);
    const ck=tr.querySelector("input"); if(ck) ck.checked=on;
  });
  updateBar();
}
$("#selAll").onclick=()=>{
  const v=STATE.view||[];
  if(STATE.sel.size===v.length && v.length){ STATE.sel.clear(); }
  else { STATE.sel = new Set(v); }
  syncSelUI();
};
function renderCrumbs(){
  const c=$("#crumbs"); c.innerHTML="";
  const mk=(label,path)=>{ const a=document.createElement("a"); a.textContent=label; a.onclick=()=>{STATE.path=path; list();}; return a; };
  c.appendChild(mk("C:\\",""));
  let acc="";
  STATE.path.split("\\").filter(Boolean).forEach(seg=>{ acc=acc?acc+"\\"+seg:seg; c.append(" \\ ", mk(seg,acc)); });
}
function updateBar(){
  const n=STATE.sel.size;
  $("#sel").textContent = T.selected(n);
  $("#clip").textContent = STATE.clip ? T.clipBar(STATE.clip.items.length, STATE.clip.op) : "";
  const one=n===1, any=n>=1;
  $("#download").disabled=!any; $("#rename").disabled=!one;
  $("#copy").disabled=!any; $("#cut").disabled=!any; $("#del").disabled=!any;
  $("#paste").disabled=!STATE.clip;
  $("#up").disabled=!STATE.path;
  const total=(STATE.view||[]).length, all=total>0 && n===total;
  const sa=$("#selAll"); sa.checked=all; sa.indeterminate=n>0 && !all;
}

// ---- Toolbar actions ----
$("#up").onclick=()=>{ if(!STATE.path) return; STATE.path=STATE.path.split("\\").slice(0,-1).join("\\"); list(); };
$("#refresh").onclick=list;
function selEntries(){ return STATE.entries.filter(e=>STATE.sel.has(e.name)); }
$("#copy").onclick=()=>setClip("copy"); $("#cut").onclick=()=>setClip("move");
function setClip(op){
  const items=[...STATE.sel].map(name=>({vmid:STATE.vmid, path:joinPath(STATE.path,name), name}));
  if(!items.length) return; STATE.clip={op,items}; toast(T.clipSet(items.length, op)); render();
}
$("#paste").onclick=async()=>{
  if(!STATE.clip) return;
  const {op,items}=STATE.clip;
  status('<span class="spin"></span> '+(op==="move"?T.moving:T.copying));
  try{
    const r=await apiJSON("paste",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op, items:items.map(i=>({vmid:i.vmid,path:i.path})), destVmid:STATE.vmid, destPath:STATE.path})});
    toast(T.pasted(r.items, r.bytesCopied?fmtSize(r.bytesCopied):""));
    STATE.clip=null; list();
  }catch(e){ status(""); toast(T.errPaste(e.message)); }
};
$("#download").onclick=()=>{
  const es=selEntries(); if(!es.length) return;
  if(es.length===1 && !es[0].isDir) return download1(es[0].name);
  // multi-selection and/or folders -> one ZIP (auth = session cookie)
  toast(T.zip);
  window.location = `/api/download-zip?vmid=${STATE.vmid}&`+
    es.map(e=>`path=${encodeURIComponent(joinPath(STATE.path,e.name))}`).join("&");
};
function dlUrl(p){ return `/api/download?vmid=${STATE.vmid}&path=${encodeURIComponent(p)}`; } // auth = session cookie
function download1(name){ window.location = dlUrl(joinPath(STATE.path,name)); }
$("#mkdir").onclick=()=>prompt2(T.mkdirTitle,T.mkdirLabel,"",async v=>{
  if(!v) return; await apiJSON("mkdir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vmid:STATE.vmid,path:joinPath(STATE.path,v)})}); list();
});
$("#rename").onclick=()=>{ const e=selEntries()[0]; if(!e) return; prompt2(T.renameTitle,T.renameLabel,e.name,async v=>{
  if(!v||v===e.name) return; await apiJSON("rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vmid:STATE.vmid,path:joinPath(STATE.path,e.name),newPath:joinPath(STATE.path,v)})}); list();
}); };
$("#del").onclick=()=>{ const names=[...STATE.sel]; if(!names.length) return; confirm2(T.confirmDelete(names.length), async()=>{
  status('<span class="spin"></span> '+T.deleting);
  try{ for(const n of names){ await apiJSON("delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vmid:STATE.vmid,path:joinPath(STATE.path,n)})}); } list(); }
  catch(e){ status(""); toast(T.errDelete(e.message)); }
}); };
$("#upload").onclick=()=>$("#fileinput").click();
$("#fileinput").onchange=async e=>{
  const files=[...e.target.files]; e.target.value="";
  for(const f of files){
    status(`<span class="spin"></span> `+escapeHtml(T.uploading(f.name)));
    try{
      const fd=new FormData(); fd.append("file",f,f.name);
      await api(`upload?vmid=${STATE.vmid}&path=${encodeURIComponent(joinPath(STATE.path,f.name))}`,{method:"POST",body:fd});
      toast(T.uploaded(f.name));
    }catch(err){ toast(T.errUpload(f.name, err.message)); }
  }
  list();
};

// ---- Tiny modals ----
function prompt2(title,label,val,cb){
  $("#card").innerHTML=`<h3>${escapeHtml(title)}</h3><label>${escapeHtml(label)}<input id="pv" value="${escapeHtml(val)}"></label>
    <div class="actions"><button class="btn" id="pc">${escapeHtml(T.cancel)}</button><button class="btn" id="po" style="border-color:var(--accent);color:var(--accent)">${escapeHtml(T.ok)}</button></div>`;
  showOverlay(); const inp=$("#pv"); inp.focus(); inp.select();
  const done=ok=>{ hideOverlay(); if(ok) cb(inp.value.trim()); };
  $("#pc").onclick=()=>done(false); $("#po").onclick=()=>done(true);
  inp.onkeydown=e=>{ if(e.key==="Enter")done(true); if(e.key==="Escape")done(false); };
}
function confirm2(msg,cb){
  $("#card").innerHTML=`<h3>${escapeHtml(T.confirmTitle)}</h3><p>${escapeHtml(msg)}</p>
    <div class="actions"><button class="btn" id="cc">${escapeHtml(T.cancel)}</button><button class="btn danger" id="co" style="border-color:var(--danger);color:var(--danger)">${escapeHtml(T.delBtn)}</button></div>`;
  showOverlay(); $("#cc").onclick=hideOverlay; $("#co").onclick=()=>{hideOverlay();cb();};
}
function showOverlay(){ $("#overlay").classList.add("show"); }
function hideOverlay(){ $("#overlay").classList.remove("show"); }
$("#overlay").onclick=e=>{ if(e.target.id==="overlay" && !e.target.dataset.fatal) hideOverlay(); };

// ---- Boot ----
(async()=>{
  // Redeem the link token (or resume the cookie session on refresh). A
  // fresh tab with no token AND no cookie can't start — back to the panel.
  try{ await startSession(); }
  catch(e){ status(escapeHtml(TOKEN ? T.badSession : T.noToken)); return; }
  try{ await loadServers(); await list(); }
  catch(e){ status(escapeHtml(T.badSession)); }
})();
</script>
</body>
