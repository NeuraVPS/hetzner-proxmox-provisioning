<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegador de archivos · NeuraVPS</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --line:#e5e7eb; --ink:#1f2937; --muted:#6b7280;
          --accent:#2563eb; --accent-bg:#eff6ff; --danger:#dc2626; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; flex-direction:column; height:100%; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header .brand { font-weight:700; color:var(--accent); }
  select, button, input[type=text] { font:inherit; }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .toolbar { background:var(--panel); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .btn:hover:not(:disabled) { background:var(--accent-bg); border-color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.danger:hover:not(:disabled) { background:#fef2f2; border-color:var(--danger); color:var(--danger); }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  .crumbs { padding:8px 14px; color:var(--muted); display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .crumbs a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .crumbs a:hover { text-decoration:underline; }
  main { flex:1; overflow:auto; padding:0 8px 8px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:#fafafa; color:var(--muted); font-weight:600; z-index:1; }
  tr.row { cursor:default; user-select:none; }
  tr.row:hover { background:#f9fafb; }
  tr.row.sel { background:var(--accent-bg); }
  td.name { width:100%; white-space:normal; }
  td.name .ic { margin-right:8px; }
  td.size,td.date { color:var(--muted); text-align:right; }
  .cut { opacity:.5; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:6px 14px; color:var(--muted); font-size:12.5px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  #clip { color:var(--accent); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
  #toast.show { opacity:.95; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .card { background:#fff; border-radius:12px; padding:18px; min-width:280px; max-width:90%; box-shadow:0 10px 40px rgba(0,0,0,.2); }
  .card h3 { margin:0 0 12px; }
  .card input { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .card .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">NeuraVPS · Archivos</span>
    <label>Servidor:
      <select id="server"></select>
    </label>
    <span id="status" style="color:var(--muted)"></span>
  </header>
  <div class="toolbar">
    <button class="btn" id="up" title="Subir un nivel">⬆️ Arriba</button>
    <button class="btn" id="refresh" title="Actualizar">🔄</button>
    <span class="sep"></span>
    <button class="btn" id="upload">⬆️ Subir</button>
    <button class="btn" id="mkdir">📁 Nueva carpeta</button>
    <button class="btn" id="download">⬇️ Descargar</button>
    <span class="sep"></span>
    <button class="btn" id="copy">📋 Copiar</button>
    <button class="btn" id="cut">✂️ Cortar</button>
    <button class="btn" id="paste">📥 Pegar</button>
    <span class="sep"></span>
    <button class="btn" id="rename">✏️ Renombrar</button>
    <button class="btn danger" id="del">🗑️ Eliminar</button>
    <input type="file" id="fileinput" multiple hidden>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <main>
    <table>
      <thead><tr><th>Nombre</th><th class="size">Tamaño</th><th class="date">Modificado</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </main>
  <footer>
    <span id="sel">0 seleccionados</span>
    <span id="clip"></span>
  </footer>
</div>
<div id="toast"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get("t") || "";
const H = { "Authorization": "Bearer " + TOKEN };
const $ = s => document.querySelector(s);
const fmtSize = n => { if(!n) return ""; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<4){n/=1024;i++;} return n.toFixed(i?1:0)+" "+u[i]; };
const fmtDate = t => t? new Date(t*1000).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"}) : "";
let STATE = { vmid:null, path:"", entries:[], sel:new Set(), clip:null }; // clip={op,items:[{vmid,path,name}]}

function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),ms); }
function status(msg){ $("#status").innerHTML = msg||""; }

async function api(path, opts={}){
  const r = await fetch("/api/"+path, { headers:{...H, ...(opts.headers||{})}, ...opts });
  if(!r.ok){ let m=r.status; try{ m=(await r.json()).detail||m; }catch{} throw new Error(m); }
  return r;
}
async function apiJSON(path, opts={}){ return (await api(path, opts)).json(); }

// ---- Servers ----
async function loadServers(){
  const d = await apiJSON("servers");
  const sel = $("#server"); sel.innerHTML="";
  d.servers.forEach(s=>{ const o=document.createElement("option"); o.value=s.vmid; o.textContent=`${s.name} (VM ${s.vmid})`; sel.appendChild(o); });
  if(!d.servers.length){ status("No hay servidores encendidos."); return; }
  STATE.vmid = d.servers[0].vmid;
  sel.value = STATE.vmid;
}
$("#server").onchange = e => { STATE.vmid = +e.target.value; STATE.path=""; STATE.sel.clear(); list(); };

// ---- Listing ----
function joinPath(p, name){ return p ? p+"\\"+name : name; }
async function list(){
  status('<span class="spin"></span> Cargando…');
  try {
    const d = await apiJSON(`list?vmid=${STATE.vmid}&path=${encodeURIComponent(STATE.path)}`);
    STATE.entries = d.entries; STATE.sel.clear();
    render();
    status(`${d.total} elemento(s)`);
  } catch(e){ status(""); toast("Error al listar: "+e.message); }
}
function render(){
  const tb=$("#list"); tb.innerHTML="";
  const empty=$("#empty");
  // folders first, then files, both alpha
  const es=[...STATE.entries].sort((a,b)=> (b.isDir-a.isDir) || a.name.localeCompare(b.name,"es"));
  if(!es.length){ empty.hidden=false; empty.textContent="Carpeta vacía"; } else empty.hidden=true;
  const cutSet = new Set((STATE.clip&&STATE.clip.op==="move"? STATE.clip.items:[]).filter(i=>i.vmid===STATE.vmid).map(i=>i.path));
  es.forEach(en=>{
    const tr=document.createElement("tr"); tr.className="row"+(cutSet.has(joinPath(STATE.path,en.name))?" cut":"");
    tr.dataset.name=en.name; tr.dataset.dir=en.isDir?"1":"";
    tr.innerHTML=`<td class="name"><span class="ic">${en.isDir?"📁":"📄"}</span>${escapeHtml(en.name)}</td>`+
                 `<td class="size">${en.isDir?"":fmtSize(en.size)}</td><td class="date">${fmtDate(en.mtime)}</td>`;
    tr.onclick=(ev)=>selectRow(en.name, ev);
    tr.ondblclick=()=>{ if(en.isDir){ STATE.path=joinPath(STATE.path,en.name); list(); } else download1(en.name); };
    if(STATE.sel.has(en.name)) tr.classList.add("sel");
    tb.appendChild(tr);
  });
  renderCrumbs(); updateBar();
}
function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function selectRow(name, ev){
  if(ev.ctrlKey||ev.metaKey){ STATE.sel.has(name)?STATE.sel.delete(name):STATE.sel.add(name); }
  else { STATE.sel.clear(); STATE.sel.add(name); }
  [...$("#list").children].forEach(tr=>tr.classList.toggle("sel", STATE.sel.has(tr.dataset.name)));
  updateBar();
}
function renderCrumbs(){
  const c=$("#crumbs"); c.innerHTML="";
  const mk=(label,path)=>{ const a=document.createElement("a"); a.textContent=label; a.onclick=()=>{STATE.path=path; list();}; return a; };
  c.appendChild(mk("C:\\",""));
  let acc="";
  STATE.path.split("\\").filter(Boolean).forEach(seg=>{ acc=acc?acc+"\\"+seg:seg; c.append(" \\ ", mk(seg,acc)); });
}
function updateBar(){
  const n=STATE.sel.size;
  $("#sel").textContent = n+" seleccionado"+(n===1?"":"s");
  $("#clip").textContent = STATE.clip ? `Portapapeles: ${STATE.clip.items.length} elemento(s) para ${STATE.clip.op==="move"?"mover":"copiar"}` : "";
  const one=n===1, any=n>=1;
  $("#download").disabled=!one; $("#rename").disabled=!one;
  $("#copy").disabled=!any; $("#cut").disabled=!any; $("#del").disabled=!any;
  $("#paste").disabled=!STATE.clip;
  $("#up").disabled=!STATE.path;
}

// ---- Toolbar actions ----
$("#up").onclick=()=>{ if(!STATE.path) return; STATE.path=STATE.path.split("\\").slice(0,-1).join("\\"); list(); };
$("#refresh").onclick=list;
function selEntries(){ return STATE.entries.filter(e=>STATE.sel.has(e.name)); }
$("#copy").onclick=()=>setClip("copy"); $("#cut").onclick=()=>setClip("move");
function setClip(op){
  const items=[...STATE.sel].map(name=>({vmid:STATE.vmid, path:joinPath(STATE.path,name), name}));
  if(!items.length) return; STATE.clip={op,items}; toast(`${items.length} elemento(s) ${op==="move"?"cortado(s)":"copiado(s)"}`); render();
}
$("#paste").onclick=async()=>{
  if(!STATE.clip) return;
  const {op,items}=STATE.clip;
  status('<span class="spin"></span> '+(op==="move"?"Moviendo":"Copiando")+"…");
  try{
    const r=await apiJSON("paste",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op, items:items.map(i=>({vmid:i.vmid,path:i.path})), destVmid:STATE.vmid, destPath:STATE.path})});
    toast(`Pegado: ${r.items} elemento(s)`+(r.bytesCopied?` (${fmtSize(r.bytesCopied)})`:""));
    STATE.clip=null; list();
  }catch(e){ status(""); toast("Error al pegar: "+e.message); }
};
$("#download").onclick=()=>{ const e=selEntries()[0]; if(e) e.isDir?downloadFolder(e.name):download1(e.name); };
function dlUrl(p,folder){ return `/api/${folder?"download-folder":"download"}?vmid=${STATE.vmid}&path=${encodeURIComponent(p)}&t=${encodeURIComponent(TOKEN)}`; }
function download1(name){ window.location = dlUrl(joinPath(STATE.path,name),false); }
function downloadFolder(name){ toast("Preparando ZIP…"); window.location = dlUrl(joinPath(STATE.path,name),true); }
$("#mkdir").onclick=()=>prompt2("Nueva carpeta","Nombre:","",async v=>{
  if(!v) return; await apiJSON("mkdir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vmid:STATE.vmid,path:joinPath(STATE.path,v)})}); list();
});
$("#rename").onclick=()=>{ const e=selEntries()[0]; if(!e) return; prompt2("Renombrar","Nuevo nombre:",e.name,async v=>{
  if(!v||v===e.name) return; await apiJSON("rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vmid:STATE.vmid,path:joinPath(STATE.path,e.name),newPath:joinPath(STATE.path,v)})}); list();
}); };
$("#del").onclick=()=>{ const names=[...STATE.sel]; if(!names.length) return; confirm2(`¿Eliminar ${names.length} elemento(s)? Esta acción no se puede deshacer.`, async()=>{
  status('<span class="spin"></span> Eliminando…');
  try{ for(const n of names){ await apiJSON("delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vmid:STATE.vmid,path:joinPath(STATE.path,n)})}); } list(); }
  catch(e){ status(""); toast("Error al eliminar: "+e.message); }
}); };
$("#upload").onclick=()=>$("#fileinput").click();
$("#fileinput").onchange=async e=>{
  const files=[...e.target.files]; e.target.value="";
  for(const f of files){
    status(`<span class="spin"></span> Subiendo ${escapeHtml(f.name)}…`);
    try{
      const fd=new FormData(); fd.append("file",f,f.name);
      await api(`upload?vmid=${STATE.vmid}&path=${encodeURIComponent(joinPath(STATE.path,f.name))}`,{method:"POST",body:fd});
      toast(`Subido: ${f.name}`);
    }catch(err){ toast(`Error subiendo ${f.name}: ${err.message}`); }
  }
  list();
};

// ---- Tiny modals ----
function prompt2(title,label,val,cb){
  $("#card").innerHTML=`<h3>${escapeHtml(title)}</h3><label>${escapeHtml(label)}<input id="pv" value="${escapeHtml(val)}"></label>
    <div class="actions"><button class="btn" id="pc">Cancelar</button><button class="btn" id="po" style="border-color:var(--accent);color:var(--accent)">Aceptar</button></div>`;
  showOverlay(); const inp=$("#pv"); inp.focus(); inp.select();
  const done=ok=>{ hideOverlay(); if(ok) cb(inp.value.trim()); };
  $("#pc").onclick=()=>done(false); $("#po").onclick=()=>done(true);
  inp.onkeydown=e=>{ if(e.key==="Enter")done(true); if(e.key==="Escape")done(false); };
}
function confirm2(msg,cb){
  $("#card").innerHTML=`<h3>Confirmar</h3><p>${escapeHtml(msg)}</p>
    <div class="actions"><button class="btn" id="cc">Cancelar</button><button class="btn danger" id="co" style="border-color:var(--danger);color:var(--danger)">Eliminar</button></div>`;
  showOverlay(); $("#cc").onclick=hideOverlay; $("#co").onclick=()=>{hideOverlay();cb();};
}
function showOverlay(){ $("#overlay").classList.add("show"); }
function hideOverlay(){ $("#overlay").classList.remove("show"); }
$("#overlay").onclick=e=>{ if(e.target.id==="overlay") hideOverlay(); };

// ---- Boot ----
(async()=>{
  if(!TOKEN){ status("Falta el token de acceso. Abre el navegador desde el panel."); return; }
  try{ await loadServers(); await list(); }
  catch(e){ status("Sesión no válida o caducada. Vuelve a abrir desde el panel."); }
})();
</script>
</body>
</html>
