# Wildcard PVE: backends from pve-proxy-backends.map.conf (sync-base-nat.py sync nodes)
# Requires *.pve.neuravps.com TLS cert (DNS-01). Comment SSL server blocks until cert exists.

server {
    server_name *.pve.neuravps.com;
    resolver 127.0.0.53 valid=10s;

    if ($pve_backend_from_host = "") {
        return 404;
    }

    proxy_cookie_domain ~^(.+)$ $host;
    proxy_cookie_path / /;

    location /set-ticket {
        proxy_cookie_domain off;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $pve_backend_from_host$request_uri;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        sub_filter '</body>' '<script>(function(){"use strict";window.addEventListener("message",function(event){var data=event.data;if(!data||data.type!=="noVNC_dispatchEvent"||!data.event||typeof data.event!=="object")return;var e=data.event;if(e.type!=="keydown"&&e.type!=="keyup")return;var el=document.getElementById("noVNC_keyboardinput");if(!el)return;var opts={key:e.key,keyCode:e.keyCode};if(e.code!=null)opts.code=e.code;if(e.ctrlKey!=null)opts.ctrlKey=!!e.ctrlKey;if(e.altKey!=null)opts.altKey=!!e.altKey;if(e.shiftKey!=null)opts.shiftKey=!!e.shiftKey;if(e.metaKey!=null)opts.metaKey=!!e.metaKey;el.dispatchEvent(new KeyboardEvent(e.type,opts));});var isMobile=(("ontouchstart" in window)||navigator.maxTouchPoints>0||(window.matchMedia&&window.matchMedia("(pointer: coarse)").matches))&&Math.min(screen.width,screen.height)<=900;if(!isMobile)return;var tries=0;var stableSelected=0;var iv=setInterval(function(){tries+=1;var resize=document.getElementById("noVNC_setting_resize");var clip=document.getElementById("noVNC_setting_view_clip");var drag=document.getElementById("noVNC_view_drag_button");var connected=!!document.getElementById("noVNC_canvas");if(resize&&resize.value!=="off"){resize.value="off";resize.dispatchEvent(new Event("change",{bubbles:true}));}if(clip&&!clip.disabled&&!clip.checked){clip.checked=true;clip.dispatchEvent(new Event("change",{bubbles:true}));window.dispatchEvent(new Event("resize"));}if(connected&&drag&&clip&&clip.checked){if(drag.classList.contains("noVNC_selected")){stableSelected+=1;}else{stableSelected=0;drag.click();}}if(tries>90||stableSelected>=3){clearInterval(iv);}},400);})();</script></body>';
        sub_filter_once on;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/pve.neuravps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pve.neuravps.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.pve.neuravps.com;
    return 301 https://$host$request_uri;
}

server {
    server_name trading.neuravps.com sqx.neuravps.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://www.neuravps.com$request_uri;
    }
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/trading.neuravps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.neuravps.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name trading.neuravps.com sqx.neuravps.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://www.neuravps.com$request_uri;
    }
}
