# Host desconocido -> neuravps.com
#
# Sin un `default_server` explicito, nginx usa el PRIMER bloque que escuche en
# ese puerto como predeterminado. Aqui resultaba ser el navegador de archivos,
# asi que cualquiera que entrase por la IP de la base —la que los invitados ven
# como su salida a Internet, y por tanto trivial de descubrir desde dentro de
# una VM— se encontraba con el navegador de archivos servido con un 200.
#
# Los nombres validos (files-*, *.pve*, sqx*, trading*) siguen casando por
# server_name y no pasan por aqui.
#
# Deploy: /etc/nginx/sites-available/00-catchall.conf + symlink en
# sites-enabled, luego `nginx -t && systemctl reload nginx`.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Se conserva el reto ACME: hoy todos los certificados son DNS-01, pero si
    # alguno cayera a HTTP-01 un 301 aqui lo dejaria sin renovar.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://neuravps.com/;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # El certificado NO va a casar con una IP: el navegador avisara antes de
    # seguir la redireccion. Es lo correcto — no existe certificado valido para
    # un Host que no es nuestro, y lo que importa es que aqui ya no se sirve
    # nada, solo se redirige.
    ssl_certificate     /etc/letsencrypt/live/neuravps-dual/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuravps-dual/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://neuravps.com/;
}
