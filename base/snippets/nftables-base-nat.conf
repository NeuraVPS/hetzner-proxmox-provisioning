[Unit]
# `veth-host.service` creates the veth pair this drop-in's ruleset
# depends on. /etc/nftables.conf's flowtable in `table inet filter`
# declares `devices = { enp*, veth-host }`; if the veth pair does not
# yet exist when nftables loads, nft errors with
#   "Could not process rule: No such file or directory"
# and rejects the entire ruleset, leaving the box with no firewall/DNAT.
#
# veth-host.service is intentionally a tiny sibling of nftables.service:
# both have `DefaultDependencies=no` and `Before=network-pre.target`,
# so they run in the same early-boot slot. Ordering veth-host before
# nftables here introduces no cycle, because veth-host.service has no
# upstream `After=` edges that would close the loop. (Trying to order
# nftables.service after `network-online.target` or `jool-nat46.service`
# from a drop-in *would* create a cycle through Debian's inherited
# `Before=network-pre.target` on nftables.service — see
# docs/netns-jool-nat46-nat66-guide.md §7.1 for the full analysis.)
Wants=veth-host.service
After=veth-host.service

[Service]
# Debian's nftables.service sandboxes /etc as read-only (ProtectSystem=).
# If anything in this drop-in ever needs to write under /etc, whitelist
# the paths here. (Currently nothing does — leaving the directive in
# place is cheap and documents intent.)
ReadWritePaths=/etc/nftables.d /var/lib/base-nat /var/log

# NO `ExecStartPost=sync-base-nat.py sync` here, even though it would
# refresh DNAT maps after every nftables (re)load. Reason: nftables.service
# now runs in the sysinit slot (After=veth-host.service, before networking),
# so DNS is not yet available. The Firestore client would spin for its
# full 300s retry budget before giving up — holding up sysinit.target,
# multi-user.target, and every other unit that follows. boot-time sync
# is therefore the job of `base-nat-boot.service` (After=network-online.target,
# see base/snippets/base-nat-boot.service), which already runs the same
# sync command once networking is actually up.
#
# For manual refresh after a Firestore change post-boot, run either:
#   /usr/local/sbin/sync-base-nat.py sync
#   systemctl restart base-nat-boot.service
# `systemctl restart nftables.service` will NOT pull fresh state — but
# the include file from §7 (/etc/nftables.d/base-nat-elements.nft) is
# rewritten atomically on every sync, so a manual nftables restart will
# still restore the last-known-good map elements from disk.
