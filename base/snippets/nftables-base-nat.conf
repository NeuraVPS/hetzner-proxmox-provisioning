[Unit]
# Wait for the WAN interface to exist before loading /etc/nftables.conf,
# so the flowtable in `table inet filter` can resolve its `devices = { ... }`
# on the first try. Without this, nftables.service fails early in boot with
# "Could not process rule: No such file or directory" and leaves the host
# with an empty ruleset until a later retry.
After=network-online.target
Wants=network-online.target

[Service]
# Debian's nftables.service sandboxes /etc as read-only (ProtectSystem=).
# ExecStartPost inherits that sandbox, so sync-base-nat.py cannot rewrite
# /etc/nftables.d/base-nat-elements.nft or its other state files unless
# we whitelist the paths it touches.
ReadWritePaths=/etc/nftables.d /var/lib/base-nat /var/log

# Re-populate dynamic DNAT maps after every (re)start of nftables. The
# include file at /etc/nftables.d/base-nat-elements.nft already restores
# last-known-good state on reload (top-level include after `table ip6 nat`
# in /etc/nftables.conf); this ExecStartPost additionally pulls fresh
# state from Firestore so we converge to the desired set even if the
# on-disk include file is stale. Leading "-" makes failure non-fatal for
# nftables itself.
ExecStartPost=-/usr/bin/python3 /usr/local/sbin/sync-base-nat.py sync
