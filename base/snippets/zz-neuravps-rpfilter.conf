# Filtro de ruta inversa: los tuneles base<->nodo lo necesitan a 0.
#
# ⚠️ EL NOMBRE DEL FICHERO ES LOAD-BEARING: tiene que empezar por `zz`.
# systemd-sysctl ordena por NOMBRE DE FICHERO, no por directorio, y PVE trae
# /usr/lib/sysctl.d/pve-firewall.conf con `net.ipv4.conf.all.rp_filter = 2`.
# Como 'p' > '9', un `99-...` PIERDE contra el de PVE y el ajuste se evapora en
# el siguiente arranque. Medido: tras reiniciar el nodo 0000228 el valor volvia
# a 2 con todo lo demas correcto.
#
# Por que hace falta el 0: con los tuneles anclados a las VIPs de failover el
# camino es ASIMETRICO A PROPOSITO (el trafico entra por el tunel de la VIP que
# la base posee y sale por el de casa). rp_filter lo tira como "martian source",
# y el sintoma engana muchisimo porque Linux NO tiene rp_filter para IPv6: v6
# pasa y v4 no, con tcpdump viendo el paquete en LOS DOS extremos y cero
# conntrack. El modo laxo (2) NO basta. Tiene que ser 0.
#
# Y por que esto NO afloja nada de cara al cliente: el kernel usa el MAXIMO de
# conf.all y conf.<iface>. Poner `all` a 0 no baja el de nadie — cada interfaz
# conserva el suyo (50-default.conf deja todas en 2), y `default` se queda en 2
# para que toda interfaz nueva nazca filtrada. El 0 lo pone explicitamente
# neuravps-tunnels.sh / neuravps-base-tunnels.sh sobre cada tunel, y solo sobre
# ellos: solo llevan GRE entre maquinas nuestras, ya filtrado por gre_peers y
# por el [IPSET base] del nodo.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 2
